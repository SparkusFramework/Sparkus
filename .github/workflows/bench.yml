name: Bench (Linux)

# Linux numbers (D8) on a GitHub-hosted runner: run by hand, or by adding the "bench" label to a PR.
# Shared 4-vCPU runners are noisy and too small to pin the server and the load generator apart
# (--pin 0): read the ranking and the ratios, not the absolute numbers.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  bench:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'bench'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: bench
      - run: >
          bun run.ts
          --targets bun-raw,sparkus-bun,sparkus-prod-bun,elysia,hono-bun,node-raw,sparkus-node,sparkus-prod-node,fastify,fastify-logger,express
          --scenarios hello,params-query,post-validate
          --rounds 3 --duration 5 --warmup 2 --pin 0 --workers 2 --label linux-ci
        working-directory: bench
        env:
          NODE_BIN: node
      - run: cat bench/results/linux-ci.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-linux
          path: bench/results/
