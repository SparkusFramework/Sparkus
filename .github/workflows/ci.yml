name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run check:deps
      # Declarations are only built for publishing; make sure they still build.
      - run: bun run build:types
      # bun check: same errors as tsc, no build needed.
      - run: bun run typecheck
      # Builds the JS with bun build, then runs every test. Conformance runs every
      # engine, including a real Node process (NODE_BIN).
      - run: bun run test
        env:
          NODE_BIN: node
      # A real app on the current framework: it must keep type checking, wiring and passing.
      - name: examples/conduit
        working-directory: examples/conduit
        shell: bash
        run: |
          bun run typecheck
          bun test
          bunx sparkus check --json
